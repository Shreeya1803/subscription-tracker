<!doctype html>
<html>
  <body style="margin:0;padding:24px;background:#f4f5f2;font-family:Arial,Helvetica,sans-serif;color:#1c2b3a">
    <table role="presentation" width="100%" style="max-width:480px;margin:0 auto;background:#ffffff;border-radius:12px;padding:28px">
      <tr><td>
        <h2 style="margin:0 0 12px;font-size:20px">Confirm your email</h2>
        <p style="margin:0 0 20px;line-height:1.5">Welcome to Subscription Tracker. Enter this code in the app to confirm your email address:</p>
        <p style="margin:0 0 20px;font-size:32px;font-weight:bold;letter-spacing:8px;text-align:center;background:#f4f5f2;border-radius:10px;padding:16px">{{ .Token }}</p>
        <p style="margin:0 0 8px;font-size:13px;color:#5f6b76">The code expires in 1 hour.</p>
        <p style="margin:0;font-size:13px;color:#5f6b76">If you didn't create an account, you can ignore this email.</p>
      </td></tr>
    </table>
  </body>
</html>
